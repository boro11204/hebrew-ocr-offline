name: Fetch models
# The two fine-tuned models (6.4 MB and 3.7 MB) are too big for the uploader used to back up this site,
# so this one-time workflow copies them from the live site, checks each SHA-256 and commits them.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-models.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the v4 models if missing
        run: |
          set -e
          changed=0
          for f in heb_rashi4 heb4; do
            if [ -f models/$f.traineddata ]; then echo "$f already here"; continue; fi
            curl -fsSL -o models/$f.traineddata https://hebrew-ocr.sites.tab.bot/tessdata/$f.traineddata
            changed=1
          done
          echo "1e66639b5ef1b50a24b06aba7e729cdb9e71db6f8f20402edadafdf9b46a3aeb  models/heb_rashi4.traineddata" | sha256sum -c -
          echo "a1422a71e9e7d060b5cc0c08e3060cc5e7a9a9ea41ecc0da43ec07d8946769a6  models/heb4.traineddata" | sha256sum -c -
          if [ $changed = 1 ]; then
            git config user.name "boro11204"
            git config user.email "boro11204@users.noreply.github.com"
            git add models/heb_rashi4.traineddata models/heb4.traineddata
            git commit -m "Add v4 fine-tuned models heb_rashi4 + heb4 (Apache-2.0, see README)"
            git push
          fi
