name: Fetch v6 files
# heb_rashi6 (6.4 MB) is too big for the uploader used to back up this repo,
# so this workflow copies it from the live site, checks its SHA-256 and commits it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fetch-models-v6.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the v6 Rashi model if missing
        run: |
          set -e
          changed=0
          f=models/heb_rashi6.traineddata; if [ ! -f $f ]; then mkdir -p $(dirname $f); curl -fsSL --retry 3 -o $f https://hebrew-ocr.sites.tab.bot/tessdata/heb_rashi6.traineddata; echo "4cb22449362b84363bed701ba2d782dc4185563461c4185bc906fa19054e41b5  $f" | sha256sum -c -; git add $f; changed=1; else echo "$f already here"; fi
          if [ $changed = 1 ]; then
            git config user.name "boro11204"
            git config user.email "boro11204@users.noreply.github.com"
            git commit -m "Add v6 file: heb_rashi6 Rashi model (checked by SHA-256)"
            git push
          fi
